name: Extract YAFFS2 from 146.bin

on:
  push:
    paths:
      - '146.bin'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk build-essential curl unzip zlib1g-dev

      - name: Download and compile unyaffs
        run: |
          # دانلود مستقیم آرشیو مخزن به جای git clone برای دور زدن خطای احراز هویت
          curl -L -o unyaffs.zip https://github.com/ehlers/unyaffs/archive/refs/heads/master.zip
          unzip unyaffs.zip
          cd unyaffs-master
          
          # رفع خطای کامپایل مربوط به هدر sysmacros در اوبونتوهای جدید
          sed -i 's|#include <sys/types.h>|#include <sys/types.h>\n#include <sys/sysmacros.h>|' unyaffs.c
          
          make
          sudo cp unyaffs /usr/local/bin/
          cd ..

      - name: Scan firmware with binwalk
        run: |
          echo "=== binwalk signature scan ==="
          binwalk 146.bin | head -100
          echo "=== End of binwalk scan ==="

      - name: Find YAFFS2 offset and extract
        run: |
          # جستجوی امضای YAFFS2 (معادل ASCII "YAFF")
          echo "=== Searching for YAFFS2 signature ==="
          binwalk -R "\x59\x41\x46\x46" 146.bin || true
          
          # جستجوی رشته‌های مرتبط برای کمک به پیدا کردن آفست
          echo "=== Searching for YAFFS strings ==="
          strings 146.bin | grep -i "yaffs" | head -10 || true

      - name: Attempt extraction with binwalk (with root)
        run: |
          # اجرای binwalk با دسترسی root برای استخراج خودکار (در صورت شناسایی)
          sudo binwalk -e --run-as=root 146.bin || true

      - name: Manual extraction with unyaffs
        run: |
          # پیدا کردن فایل‌های استخراج شده توسط binwalk و تلاش برای unyaffs
          find _146.bin.extracted -type f \( -name "*.yaffs*" -o -name "*.img" \) 2>/dev/null | while read file; do
            echo "Processing: $file"
            output_dir="yaffs_out_$(basename $file)"
            mkdir -p "$output_dir"
            # تلاش برای استخراج (تشخیص خودکار page size)
            unyaffs "$file" "$output_dir" || true
            # اگر تشخیص خودکار شکست خورد، با page size 2KB (2048) تلاش می‌کنیم
            # unyaffs -p 2048 "$file" "$output_dir" || true
          done

      - name: List extracted files
        run: |
          echo "=== Extracted files ==="
          find yaffs_out_* -type f 2>/dev/null | head -100
          echo "Total files: $(find yaffs_out_* -type f 2>/dev/null | wc -l)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-146-yaffs2-${{ github.run_id }}
          path: |
            _146.bin.extracted/
            yaffs_out_*/
          if-no-files-found: warn
