name: Extract YAFFS2 from 146.bin (Final)

on:
  push:
    paths:
      - '146.bin'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zlib1g-dev

            - name: Download and compile unyaffs (from Debian)
        run: |
          # دانلود مستقیم فایل سورس از مخزن Debian (نیازی به Git ندارد)
          curl -L -o unyaffs.tar.gz https://deb.debian.org/debian/pool/main/u/unyaffs/unyaffs_0.9.7.orig.tar.gz
          
          # استخراج فایل فشرده
          tar -xzf unyaffs.tar.gz
          
          # ورود به پوشه سورس (نام پوشه معمولاً unyaffs-0.9.7 است)
          cd unyaffs-0.9.7
          
          # رفع خطای کامپایل مربوط به هدر sysmacros در اوبونتوهای جدید
          sed -i 's|#include <sys/types.h>|#include <sys/types.h>\n#include <sys/sysmacros.h>|' unyaffs.c
          
          # کامپایل
          make
          
          # کپی فایل اجرایی به مسیر سیستم
          sudo cp unyaffs /usr/local/bin/
          
          # بازگشت به پوشه اصلی
          cd ..

      - name: Find YAFFS2 binary signature
        id: find_yaffs
        run: |
          echo "=== Searching for YAFFS2 signature (59 41 46 46) ==="
          # جستجوی مستقیم باینری برای رشته YAFF
          OFFSET_HEX=$(grep -a -b -o $'\x59\x41\x46\x46' 146.bin | head -1 | cut -d: -f1 || true)
          
          if [ -n "$OFFSET_HEX" ]; then
            OFFSET_DEC=$OFFSET_HEX
            OFFSET_HEX_FMT=$(printf '0x%X' $OFFSET_DEC)
            echo "Found YAFFS2 signature at decimal offset: $OFFSET_DEC ($OFFSET_HEX_FMT)"
            echo "yaffs_offset=$OFFSET_DEC" >> $GITHUB_OUTPUT
          else
            echo "No YAFFS2 signature found with grep."
            echo "yaffs_offset=" >> $GITHUB_OUTPUT
          fi

      - name: Carve and extract YAFFS2
        if: steps.find_yaffs.outputs.yaffs_offset != ''
        run: |
          OFFSET=${{ steps.find_yaffs.outputs.yaffs_offset }}
          echo "=== Carving from offset $OFFSET ==="
          
          # برش دادن فایل از آفست پیدا شده تا انتها
          dd if=146.bin of=carved_yaffs.img bs=1 skip=$OFFSET 2>/dev/null
          ls -la carved_yaffs.img
          
          # تلاش برای استخراج
          mkdir -p yaffs_output
          echo "=== Running unyaffs (auto-detect) ==="
          unyaffs carved_yaffs.img yaffs_output || true
          
          # اگر شکست خورد، با page size مشخص تلاش می‌کنیم
          if [ ! -d "yaffs_output/bin" ] && [ ! -d "yaffs_output/system" ] && [ ! -d "yaffs_output/etc" ]; then
            echo "=== Retrying with page size 2048 ==="
            rm -rf yaffs_output
            mkdir -p yaffs_output
            unyaffs -p 2048 carved_yaffs.img yaffs_output || true
          fi

      - name: List extracted files
        run: |
          echo "=== Extracted files ==="
          find yaffs_output -type f 2>/dev/null | head -100
          echo "Total files: $(find yaffs_output -type f 2>/dev/null | wc -l)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-146-yaffs2-${{ github.run_id }}
          path: |
            carved_yaffs.img
            yaffs_output/
          if-no-files-found: warn
