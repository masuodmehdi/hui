name: Extract YAFFS2 from 146.bin (Corrected)

on:
  push:
    paths:
      - '146.bin'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk build-essential git zlib1g-dev python3-pip
          pip3 install --upgrade binwalk

      - name: Compile unyaffs from source
        run: |
          git clone https://github.com/ehlers/unyaffs.git
          cd unyaffs
          # رفع خطای کامپایل مربوط به sysmacros در سیستم‌های جدید اوبونتو
          sed -i 's|#include <sys/types.h>|#include <sys/types.h>\n#include <sys/sysmacros.h>|' unyaffs.c
          make
          sudo cp unyaffs /usr/local/bin/
          cd ..

      - name: Find YAFFS2 offset with binwalk
        run: |
          echo "=== Scanning for YAFFS2 signature (0x59414646) ==="
          # جستجوی دقیق برای امضای YAFFS2
          binwalk -R "\x59\x41\x46\x46" 146.bin | head -20 || true
          
          # همچنین جستجوی رشته YAFFS در فایل
          echo "=== Searching for YAFFS strings ==="
          strings 146.bin | grep -i "yaffs" | head -10 || true

      - name: Extract YAFFS2 with binwalk (with root)
        run: |
          # اجرای binwalk با دسترسی root برای استخراج خودکار
          sudo binwalk -e --run-as=root 146.bin || true

      - name: Find and extract YAFFS2 image manually
        run: |
          # پیدا کردن فایل YAFFS2 استخراج شده توسط binwalk
          find _146.bin.extracted -type f -name "*.yaffs2" -o -name "*.yaffs" -o -name "*.img" 2>/dev/null | while read file; do
            echo "Processing: $file"
            output_dir="yaffs_out_$(basename $file)"
            mkdir -p "$output_dir"
            unyaffs "$file" "$output_dir" || true
          done

      - name: List extracted files
        run: |
          echo "=== Extracted files ==="
          find yaffs_out_* -type f 2>/dev/null | head -100
          echo "Total files: $(find yaffs_out_* -type f 2>/dev/null | wc -l)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-146-yaffs2
          path: |
            _146.bin.extracted/
            yaffs_out_*/
          if-no-files-found: warn
