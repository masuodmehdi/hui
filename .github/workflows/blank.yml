      - name: Extract JFFS2 from known offset
        run: |
          mkdir -p output
          OFFSET=402412
          echo "=== Carving JFFS2 from offset $OFFSET ==="
          dd if=144.bin of=carved.jffs2 bs=1 skip=$OFFSET 2>/dev/null
          ls -la carved.jffs2
          echo "=== Running jefferson on carved image ==="
          jefferson carved.jffs2 -d output 2>&1 | tee jefferson_carved.log || true
          echo "=== Extraction result ==="
          find output/ -type f 2>/dev/null | head -50
          echo "Total files: $(find output/ -type f 2>/dev/null | wc -l)"
