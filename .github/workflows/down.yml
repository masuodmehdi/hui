name: Download and Extract File

on:
  workflow_dispatch:

permissions:
  contents: write   # نیاز برای push کردن تغییرات به مخزن

jobs:
  download-extract:
    runs-on: ubuntu-latest
    env:
      FILE_URL: "https://uploadkon.ir/uploads/6f1b02_26146.zip"
      FILE_NAME: "downloaded_file.zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download File
        run: |
          echo "Downloading from: $FILE_URL"
          curl -L -o "$FILE_NAME" "$FILE_URL"

      - name: Extract File in Root
        run: |
          if [[ "$FILE_NAME" == *.zip ]]; then
            echo "Extracting ZIP file to root..."
            unzip -o "$FILE_NAME" -d .
          elif [[ "$FILE_NAME" == *.tar.gz ]] || [[ "$FILE_NAME" == *.tgz ]]; then
            echo "Extracting TAR.GZ file to root..."
            tar -xzf "$FILE_NAME" -C .
          else
            echo "Unsupported file format. File kept as-is in root."
          fi

      - name: Remove Archive File
        run: |
          rm -f "$FILE_NAME"

      - name: Commit and Push Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add extracted files from $FILE_URL"
            git push
          fi

      - name: List Files in Root
        run: |
          echo "Files in repository root:"
          ls -la
