name: Extract Router Firmware JFFS2

on:
  push:
    paths:
      - '144.bin'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk liblzo2-dev lzop

      - name: Install jefferson
        run: |
          pip install jefferson

      - name: Diagnose firmware with binwalk
        run: |
          echo "=== binwalk signature scan ==="
          binwalk 144.bin | head -80
          echo "=== End of binwalk scan ==="

      - name: Carve and extract JFFS2
        run: |
          mkdir -p output
          OFFSET=402412
          echo "=== Carving JFFS2 from offset $OFFSET ==="
          dd if=144.bin of=carved.jffs2 bs=1 skip=$OFFSET 2>/dev/null
          ls -la carved.jffs2
          echo "=== Running jefferson on carved image ==="
          jefferson carved.jffs2 -d output 2>&1 | tee jefferson_carved.log || true
          echo "=== Extraction result ==="
          find output/ -type f 2>/dev/null | head -50
          echo "Total files: $(find output/ -type f 2>/dev/null | wc -l)"

      - name: List output contents
        run: |
          echo "=== Output directory listing ==="
          ls -la output/ || echo "output dir missing"
          echo "=== File listing (first 100) ==="
          find output/ -type f 2>/dev/null | head -100
          echo "=== Total file count ==="
          find output/ -type f 2>/dev/null | wc -l

      - name: Upload extracted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-jffs2
          path: |
            output/
            jefferson_carved.log
            carved.jffs2
          if-no-files-found: warn
          retention-days: 7
