name: Extract Router Firmware JFFS2

on:
  push:
    paths:
      - '144.bin'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk liblzo2-dev lzop

      - name: Install jefferson
        run: |
          pip install jefferson

      - name: Diagnose firmware with binwalk
        run: |
          echo "=== binwalk signature scan ==="
          binwalk 144.bin | head -80
          echo "=== End of binwalk scan ==="

      - name: Extract JFFS2 (auto-detect offset)
        run: |
          mkdir -p output
          # Try direct extraction first
          echo "=== Attempting direct jefferson extraction ==="
          jefferson 144.bin -d output 2>&1 | tee jefferson_direct.log || true

          # Count extracted files
          FILE_COUNT=$(find output -type f 2>/dev/null | wc -l)
          echo "Direct extraction file count: $FILE_COUNT"

          # If direct extraction produced nothing, try to locate JFFS2 offset via binwalk and carve it
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "=== Direct extraction empty, trying offset-based carve ==="
            # Extract JFFS2 offset from binwalk output (first JFFS2 signature)
            OFFSET=$(binwalk 144.bin | grep -i "jffs2" | head -1 | awk '{print $1}')
            if [ -n "$OFFSET" ]; then
              echo "Found JFFS2 at offset: $OFFSET"
              # Decode offset (binwalk prints decimal by default; use as-is)
              dd if=144.bin of=carved.jffs2 bs=1 skip=$OFFSET 2>/dev/null || true
              echo "=== Running jefferson on carved image ==="
              jefferson carved.jffs2 -d output 2>&1 | tee jefferson_carved.log || true
            else
              echo "No JFFS2 signature found by binwalk."
            fi
          fi

      - name: List output contents
        run: |
          echo "=== Output directory listing ==="
          ls -la output/ || echo "output dir missing"
          echo "=== File listing (first 100) ==="
          find output/ -type f 2>/dev/null | head -100
          echo "=== Total file count ==="
          find output/ -type f 2>/dev/null | wc -l

      - name: Upload extracted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-jffs2
          path: |
            output/
            jefferson_direct.log
            jefferson_carved.log
            carved.jffs2
          if-no-files-found: warn
          retention-days: 7
